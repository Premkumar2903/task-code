<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:rgb(38, 133, 133)
        }
        h1{
            background-color: rgb(184, 38, 38);
            padding: 10px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        input{
            padding: 5px;
        }
        input:focus{
            outline: none;
        }
        select{
            padding: 5px;
        }

        button{
            padding: 5px;
            margin-left: 5px;
            background-color: lightgoldenrodyellow;
            border: none;
        }

        #list{
            background-color: beige;
            width: 45%;
        }
    </style>
</head>
<body>

    <h1>
        Avengers
    </h1>

    <input type="text" name="name" id="name" placeholder="Enter the name">
    <input type="number"id="age" placeholder="Enter the Age">
    
    <select name="" id="role" value="">
        <option value="Front end">Front end</option>
        <option value="Back end">Back end</option>
        <option value="Full-stack-lead" selected>Full-stack-lead</option>
        <option value="Api">Api</option>
    </select>

    <button onclick="add()">Submit</button>

    <ul id="list">
        
    </ul>

    <script>
        function add() {
            

            inputName = document.getElementById('name')
            inputAge = document.getElementById('age')
            inputRole = document.querySelector('select')
            list = document.getElementById('list')

            name = inputName.value.trim()
            age = inputAge.value.trim()
            role = inputRole.value;

            if(!name || !age || !role){         //checks all filds are filled
                alert('Please fill all fields')
                return;                         //if not returns the function
            }
            

            li = document.createElement('li')
            li.textContent = `Name: ${name}, Age: ${age}, Role: ${role}`
            list.append(li)


            inputName.value = ''
            inputAge.value = ''
        }
    </script>

</body>
</html>
