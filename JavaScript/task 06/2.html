<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="num">Enter the number: </label>
    <input type="number" id="input">

    <p id="result"></p>

    <button onclick="sum()">Calculate</button>
    <script>
        
        function sum() {
            let N = Number(document.getElementById('input').value)

            let add = (N * (N+1))/2

            document.getElementById('result').innerHTML = 'sum of 1 to ' +  N +' is '+add
        }
    </script>
</body>
</html>
