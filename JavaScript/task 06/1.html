<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="work" >Work is in on progress</p>
    <button id="update" onclick="status()">status</button>

    <script>
        function status() {
            const done = document.getElementById('work')
            done.innerHTML  = 'Done'
            done.style.fontSize= '2rem'
            done.style.backgroundColor= 'yellow'
        }
        
        document.getElementById('update').style.backgroundColor= 'green'
    </script>
</body>
</html>
