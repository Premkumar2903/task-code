<body>
    
    <script>
        function Prime(n) {
            if(n<=1) {   //return false if num is 1 or less
                return false;
            }

                //primeNum has two factor (1 , itself)
                for(let i = 2; i < n; i++){ //count from 2 to n-1 because n is factor itself
                    if(n % i == 0){
                        return false
                    }
                }
            
            return true;
        }

        console.log(Prime(3));
        console.log(Prime(10));
    </script>
</body>
