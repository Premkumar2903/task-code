<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!-- Bootstrap Utilities are small helper classes used to style elements quickly without writing custom CSS. -->
    
    <div class="m-5 p-4 bg-info">Margin 3, Padding 2</div>

    <p class="text-center">Centered Text</p>
    <p class="text-end">Right Aligned</p>
    <p class="text-start">left Aligned</p>

    <p class="fw-bold">Bold Text</p>
    <p class="text-danger">Red Text</p>
    <p class="text-success">Success Text</p>
    <p class="text-info">Info Text</p>

    <div class="d-flex justify-content-between">
        <div>Left</div>
        <div>Right</div>
    </div>

    <div class="w-50 bg-primary text-white p-2">50% Width</div>
    <div class="h-100 bg-success p-2">Full Height</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
