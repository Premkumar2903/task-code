<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            display: grid;
            grid-template-columns: 200px 200px 200px ;
            grid-template-rows: 100px 100px;
        }

        .cont div{
            border: 5px black solid;
            margin: 5px;
        }

        .container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px , 1fr));
            grid-template-rows: 100px 100px;
        }

        .container div{
            border: 5px black solid;
            margin: 5px;
        }

        
    </style>
</head>
<body>
    <div class="cont">
        <div >1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

    <div class="container">
        <div >1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>
